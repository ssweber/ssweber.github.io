<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 790" role="img" aria-labelledby="title desc">
  <title id="title">The CLICK round trip</title>
  <desc id="desc">CLICK Programming Software is the only place where an engineer saves Machine.ckp. ClickNick refreshes a readable workspace, pyrung checks it offline, and Preview Changes plus Guided Paste return selected rungs through CLICK for review and Save. Under the hood, laddercodec handles CLICK's clipboard format and pyclickplc can optionally talk Modbus TCP to a real CLICK PLC.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#657069"/>
    </marker>
    <style>
      .canvas{fill:#f7f9f7;stroke:#d9e3dc;stroke-width:2}.heading{fill:#28312b;font:700 28px system-ui,-apple-system,"Segoe UI",sans-serif}.subheading{fill:#657069;font:16px system-ui,-apple-system,"Segoe UI",sans-serif}.title{fill:#28312b;font:700 19px system-ui,-apple-system,"Segoe UI",sans-serif}.body{fill:#344139;font:16px system-ui,-apple-system,"Segoe UI",sans-serif}.small{fill:#657069;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}.tiny{fill:#657069;font:11px system-ui,-apple-system,"Segoe UI",sans-serif}.label{fill:#526058;font:700 13px system-ui,-apple-system,"Segoe UI",sans-serif}.mono{fill:#253a2d;font:15px ui-monospace,"Cascadia Code",Consolas,monospace}.authority{fill:#fff;stroke:#5f6d64;stroke-width:2}.workspace{fill:#eaf5ee;stroke:#17653a;stroke-width:2}.inner{fill:#fff;stroke:#b8d8c3;stroke-width:1.5}.proposal{fill:#fff6df;stroke:#b58a32;stroke-width:2}.library{fill:#eef5fa;stroke:#4d7890;stroke-width:2}.trust{fill:#fff;stroke:#17653a;stroke-width:2}.connector{fill:none;stroke:#657069;stroke-width:2.5;marker-end:url(#arrow)}.connector-both{fill:none;stroke:#657069;stroke-width:2.5;marker-start:url(#arrow);marker-end:url(#arrow)}.optional{stroke-dasharray:8 7}.divider{stroke:#d9e3dc;stroke-width:1.5}
    </style>
  </defs>

  <rect class="canvas" x="10" y="10" width="1100" height="770" rx="24"/>
  <text class="heading" x="48" y="58">The CLICK round trip</text>
  <text class="subheading" x="48" y="86">Readable source can leave CLICK. The .ckp changes only when an engineer saves in CLICK.</text>

  <rect class="authority" x="48" y="125" width="250" height="230" rx="16"/>
  <text class="title" x="68" y="162">CLICK Programming</text>
  <text class="title" x="68" y="187">Software</text>
  <rect class="inner" x="68" y="210" width="210" height="61" rx="10"/>
  <text class="mono" x="88" y="236">Machine.ckp</text>
  <text class="small" x="88" y="258">saved CLICK project</text>
  <text class="body" x="68" y="302">Engineer reviews and saves.</text>
  <text class="small" x="68" y="328">Only Save here changes the file.</text>

  <path class="connector" d="M298 245 H358"/>
  <text class="label" x="328" y="218" text-anchor="middle">SAVE /</text>
  <text class="label" x="328" y="234" text-anchor="middle">RELOAD</text>

  <rect class="workspace" x="365" y="105" width="385" height="300" rx="18"/>
  <text class="title" x="390" y="140">ClickNick workspace</text>
  <text class="small" x="390" y="164">Generated source refreshes from the CLICK project.</text>
  <rect class="inner" x="385" y="176" width="150" height="146" rx="11"/>
  <text class="label" x="402" y="200">REFRESHED</text>
  <text class="mono" x="402" y="230">src/plc/</text>
  <text class="small" x="402" y="251">readable ladder</text>
  <text class="mono" x="402" y="278">csv/</text>
  <text class="small" x="402" y="300">accepted snapshot</text>
  <rect class="inner" x="550" y="176" width="180" height="146" rx="11"/>
  <text class="label" x="567" y="200">PRESERVED</text>
  <text class="mono" x="567" y="230">tests/ · notes/</text>
  <text class="mono" x="567" y="256">fixtures/ · repros/</text>
  <text class="small" x="567" y="284">yours, kept when</text>
  <text class="small" x="567" y="302">source refreshes</text>
  <rect x="385" y="330" width="345" height="62" rx="11" fill="#fff" stroke="#8bb594" stroke-width="1.5"/>
  <text class="label" x="402" y="350">OFFLINE WORKBENCH</text>
  <text class="mono" x="402" y="371">pyrung · checks · tests · Console</text>
  <text class="tiny" x="402" y="387">why() · how() · modeled scans, not the real PLC</text>

  <path class="connector" d="M750 185 C775 185 780 160 810 160"/>

  <rect class="proposal" x="810" y="105" width="262" height="112" rx="16"/>
  <text class="title" x="834" y="140">Preview Changes</text>
  <text class="body" x="834" y="170">Rung-by-rung diff</text>
  <text class="small" x="834" y="196">Choose what moves forward.</text>

  <path class="connector" d="M941 217 V255"/>
  <text class="label" x="958" y="241">SELECT</text>

  <rect class="authority" x="810" y="260" width="262" height="100" rx="16"/>
  <text class="title" x="834" y="294">Guided Paste</text>
  <text class="body" x="834" y="321">CLICK’s own ladder paste</text>
  <text class="small" x="834" y="345">Step by step, in CLICK.</text>

  <path class="connector" d="M810 330 V438 H173 V355"/>
  <text class="label" x="492" y="428" text-anchor="middle">PASTE · REVIEW · SAVE IN CLICK</text>

  <rect class="trust" x="48" y="470" width="1024" height="74" rx="14"/>
  <text class="title" x="72" y="501">ClickNick never edits Machine.ckp.</text>
  <text class="body" x="72" y="527">Only an engineer’s Save in CLICK Programming Software does.</text>

  <line class="divider" x1="48" y1="574" x2="1072" y2="574"/>
  <text class="label" x="48" y="600">UNDER THE HOOD</text>

  <rect class="authority" x="48" y="630" width="245" height="125" rx="16"/>
  <text class="title" x="72" y="666">CLICK PLC</text>
  <text class="body" x="72" y="696">Real program · real I/O</text>
  <text class="small" x="72" y="726">The machine itself.</text>

  <path class="connector-both optional" d="M293 692 H365"/>

  <rect class="library" x="365" y="630" width="320" height="125" rx="16"/>
  <text class="title" x="390" y="666">pyclickplc</text>
  <text class="body" x="390" y="696">Modbus TCP for CLICK, in Python</text>
  <text class="small" x="390" y="726">Optional live connection to a real PLC.</text>

  <rect class="library" x="750" y="630" width="322" height="125" rx="16"/>
  <text class="title" x="775" y="666">laddercodec</text>
  <text class="body" x="775" y="696">The codec for CLICK’s clipboard format</text>
  <text class="small" x="775" y="726">What Guided Paste puts on the clipboard.</text>
</svg>
